name: Build TITO PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make git python3 zip

      - name: Clone OpenOrbis toolchain (prebuilt tools in bin/linux, no build needed)
        run: git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/ps4tc

      - name: Make toolchain binaries executable
        run: |
          chmod -R +x $HOME/ps4tc/bin/linux
          echo "OO_PS4_TOOLCHAIN=$HOME/ps4tc" >> $GITHUB_ENV
          echo "$HOME/ps4tc/bin/linux" >> $GITHUB_PATH

      - name: Show toolchain contents (for debugging)
        run: |
          ls -la $HOME/ps4tc
          ls -la $HOME/ps4tc/bin/linux || true

      - name: Build ELF
        run: make

      - name: Prepare package metadata (sce_sys is created here, not in the zip)
        run: |
          mkdir -p sce_sys
          cp Tito.png sce_sys/icon0.png

      - name: Create PKG
        run: echo "PKG step - уточним после логов"

      - uses: actions/upload-artifact@v4
        with:
          name: tito-build-output
          path: |
            *.elf
            *.oelf
            *.pkg
            sce_sys/**
          if-no-files-found: warn
