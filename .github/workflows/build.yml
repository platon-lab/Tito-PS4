name: Build TITO THEME PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare theme images (on runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert Tito.png -background white -flatten -resize 512x512 -gravity center -extent 512x512 icon512.png
          convert Tito.png -background "#202030" -flatten -resize x900 -gravity center -extent 1920x1080 pic0.png
          cp pic0.png pic1.png

      - name: Prepare theme project (python on runner)
        run: python3 make_theme_files.py

      - name: Pull OpenOrbis toolchain image
        run: docker pull openorbisofficial/toolchain:latest

      - name: Build theme PKG (PkgTool in container)
        run: |
          docker run --rm --user root -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -c "PkgTool.Core pkg_build pkg/pkg.gp4 ."

      - name: Validate and list PKG contents (diagnostics)
        if: always()
        run: |
          docker run --rm --user root -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -c 'for p in *.pkg; do [ -f "$p" ] || continue; echo "=== validate $p"; PkgTool.Core pkg_validate --verbose "$p" || true; echo "=== entries $p"; PkgTool.Core pkg_listentries "$p" || true; done; [ -f *.pkg ] || echo "no .pkg produced"'

      - name: Upload theme
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tito-theme
          path: |
            *.pkg
            pkg/**
          if-no-files-found: warn
