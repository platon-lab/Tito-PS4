name: Build TITO THEME PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare theme images (on runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # убираем белый фон у собаки
          convert tito.png -fuzz 12% -transparent white dog.png
          # иконка 512x512: тёмный градиент + Тито по центру
          convert -size 512x512 gradient:"#0d0d1a-#2a1f4a" \
            \( dog.png -resize 420x420 \) -gravity center -composite icon512.png
          # фон 1920x1080 с Тито справа
          convert -size 1920x1080 gradient:"#0d0d1a-#1b1040" \
            \( dog.png -resize x980 \) -gravity east -geometry +120+0 -composite \
            -gravity southwest -fill "#c9a8ff" -pointsize 96 -annotate +80+60 "TITO" \
            pic0.png
          # второй фон: зеркальный градиент, без текста
          convert -size 1920x1080 gradient:"#1b1040-#0d0d1a" \
            \( dog.png -resize x900 \) -gravity west -geometry +160+60 -composite \
            pic1.png

      - name: Prepare theme project (python on runner)
        run: python3 make_theme_files.py

      - name: Pull OpenOrbis toolchain image
        run: docker pull openorbisofficial/toolchain:latest

      - name: Build theme PKG (PkgTool in container)
        run: |
          docker run --rm --user root -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -c "PkgTool.Core pkg_build pkg/pkg.gp4 ."

      - name: Validate and list PKG contents (diagnostics)
        if: always()
        run: |
          docker run --rm --user root -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -c 'for p in *.pkg; do [ -f "$p" ] || continue; echo "=== validate $p"; PkgTool.Core pkg_validate --verbose "$p" || true; echo "=== entries $p"; PkgTool.Core pkg_listentries "$p" || true; done; [ -f *.pkg ] || echo "no .pkg produced"'

      - name: Upload theme
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tito-theme
          path: |
            *.pkg
            pkg/**
          if-no-files-found: warn
