name: Build TITO PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make git python3 zip

      - name: Build OpenOrbis toolchain
        run: |
          git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/ps4tc
          cd $HOME/ps4tc && make -j$(nproc)
          echo "OO_PS4_TOOLCHAIN=$HOME/ps4tc" >> $GITHUB_ENV
          echo "$HOME/ps4tc/bin/linux" >> $GITHUB_PATH

      - name: Build ELF
        run: make

      - name: Prepare package metadata (sce_sys is created here, not in the zip)
        run: |
          mkdir -p sce_sys
          cp Tito.png sce_sys/icon0.png
          # param.sfo и gp4 создаются инструментами тулчейна — шаги уточним по логу первого запуска

      - name: Create PKG
        run: |
          # Шаги create-gp4 / pkg_build зависят от версии тулчейна.
          # Этот шаг нужно выровнять по официальному samples/ OpenOrbis.
          echo "PKG step: adjust after first run"

      - uses: actions/upload-artifact@v4
        with:
          name: tito-pkg
          path: |
            *.pkg
            *.elf
            *.oelf
