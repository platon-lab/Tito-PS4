name: Build TITO PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make cmake ninja-build git python3 zip

      - name: Clone OpenOrbis toolchain
        run: git clone --recursive https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/ps4tc

      - name: Build OpenOrbis toolchain
        run: |
          cd $HOME/ps4tc
          echo "== repo root =="
          ls -la
          if [ -f CMakeLists.txt ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build
          elif [ -f Makefile ] || [ -f makefile ]; then
            make -j$(nproc)
          else
            echo "Не нашёл CMakeLists.txt и Makefile. Вот README тулчейна:"
            cat README.md || true
            exit 1
          fi

      - name: Locate toolchain
        run: |
          TC=$HOME/ps4tc
          echo "== toolchain tools =="
          find $TC -maxdepth 4 -type f -perm -u+x \( -name 'orbis-clang*' -o -name 'create-gp4*' -o -name 'pkg*' -o -name 'create-fself*' \) | head -50
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV

      - name: Build ELF
        run: make

      - name: Prepare package metadata (sce_sys is created here, not in the zip)
        run: |
          mkdir -p sce_sys
          cp Tito.png sce_sys/icon0.png
          # param.sfo и gp4 — шаги уточним по логу предыдущего шага (Locate toolchain)

      - name: Create PKG
        run: echo "PKG step: уточним после логов"

      - uses: actions/upload-artifact@v4
        with:
          name: tito-build-output
          path: |
            *.elf
            *.oelf
            *.pkg
            sce_sys/**
          if-no-files-found: warn
