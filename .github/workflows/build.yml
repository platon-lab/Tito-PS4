name: Build TITO PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare icon 512x512 (on runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert Tito.png -background white -flatten -resize 512x512 -gravity center -extent 512x512 icon512.png

      - name: Pull OpenOrbis toolchain image
        run: docker pull openorbisofficial/toolchain:latest

      - name: Build eboot.bin (OpenOrbis toolchain in Docker)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -c "make eboot.bin"

      - name: Build PKG
        continue-on-error: true
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -c "make pkg"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tito-build-output
          path: |
            eboot.bin
            tito.elf
            pkg/**
            *.pkg
          if-no-files-found: warn
