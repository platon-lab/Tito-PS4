name: Build TITO PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make python3 zip imagemagick

      - name: Install .NET (for PkgTool)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x
            6.0.x
            8.0.x

      - name: Clone OpenOrbis toolchain (prebuilt, no build needed)
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/ps4tc
          chmod -R +x $HOME/ps4tc/bin/linux
          echo "OO_PS4_TOOLCHAIN=$HOME/ps4tc" >> $GITHUB_ENV

      - name: Show toolchain tools
        run: |
          ls -la $HOME/ps4tc/bin/linux
          ls -la $HOME/ps4tc/lib | head -80

      - name: Build eboot.bin
        run: make eboot.bin

      - name: Prepare icon (512x512)
        run: convert Tito.png -background white -flatten -resize 512x512 -gravity center -extent 512x512 icon512.png

      - name: Build PKG
        continue-on-error: true
        run: make pkg

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tito-build-output
          path: |
            eboot.bin
            tito.elf
            pkg/**
            *.pkg
          if-no-files-found: warn
