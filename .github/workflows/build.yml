name: Build TITO PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make python3 zip imagemagick

      - name: Install .NET (for PkgTool)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x
            6.0.x
            8.0.x

      - name: Clone OpenOrbis toolchain (prebuilt, no build needed)
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git $HOME/ps4tc
          chmod -R +x $HOME/ps4tc/bin/linux
          echo "OO_PS4_TOOLCHAIN=$HOME/ps4tc" >> $GITHUB_ENV

      - name: Add musl libc headers to toolchain (same as official toolchain CI)
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/musl.git $HOME/musl
          if [ ! -d "$HOME/musl/ps4/include" ]; then
            echo "Нет папки ps4/include в musl. Содержимое репозитория:"
            ls -la $HOME/musl
            exit 1
          fi
          cp -r $HOME/musl/ps4/include/* $HOME/ps4tc/include/
          ls $HOME/ps4tc/include | head -50

      - name: Show toolchain tools
        run: |
          ls -la $HOME/ps4tc/bin/linux
          ls -la $HOME/ps4tc/lib | head -80

      - name: Build eboot.bin
        run: make eboot.bin

      - name: Prepare icon (512x512)
        run: convert Tito.png -background white -flatten -resize 512x512 -gravity center -extent 512x512 icon512.png

      - name: Build PKG
        continue-on-error: true
        run: make pkg

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tito-build-output
          path: |
            eboot.bin
            tito.elf
            pkg/**
            *.pkg
          if-no-files-found: warn
